[package]
name = "video-perception"
version = "0.3.0"
edition = "2024"
description = "Practiced local-first video perception for agents"

[[bin]]
name = "video-perception"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "7"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rayon = "1"
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
semver = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync"] }
base64 = "0.22"

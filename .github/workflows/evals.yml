name: Evals

on:
  push:
    branches: [main]
    paths:
      - "schema/**"
      - "cli/src/workspace/**"
  pull_request:
    branches: [main]
    paths:
      - "schema/**"
      - "cli/src/workspace/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  schema-export:
    name: Schema Export Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Export JSON schemas
        run: npx tsx schema/export-json-schema.ts

      - name: Check for uncommitted schema drift
        run: |
          if ! git diff --quiet schema/json/; then
            echo "::error::JSON Schema files are out of date. Run 'npx tsx schema/export-json-schema.ts' and commit."
            git diff schema/json/
            exit 1
          fi

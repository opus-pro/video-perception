name: Dispatch DeepSeek Harness Plugin

on:
  workflow_dispatch:
  repository_dispatch:
    types: [dsh-plugin-release]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/deepseek-harness/package-lock.json

      - name: Install
        working-directory: integrations/deepseek-harness
        run: npm ci

      - name: Verify
        working-directory: integrations/deepseek-harness
        run: npm run check

      - name: Package
        working-directory: integrations/deepseek-harness
        run: mkdir -p dist && npm pack --pack-destination dist

      - name: Upload installable plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: video-perception-dsh-plugin
          path: integrations/deepseek-harness/dist/*.tgz
          if-no-files-found: error

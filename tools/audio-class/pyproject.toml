[project]
name = "video-perception-audio-class"
version = "0.1.0"
description = "Audio segment classification: speech, music, silence, noise"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
]

[project.scripts]
video-perception-audio-class = "audio_class.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-perception-spectral"
version = "0.1.0"
description = "Audio spectral analysis: centroid, bandwidth, rolloff, flatness, MFCCs per scene"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
]

[project.scripts]
video-perception-spectral = "spectral.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

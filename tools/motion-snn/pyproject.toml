[project]
name = "video-perception-motion-snn"
version = "0.1.0"
description = "Per-frame motion intensity via a lightweight LIF spiking neural network over event-rate input"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
]

[project.scripts]
video-perception-motion-snn = "motion_snn.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motion_snn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
